<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- it is external javascript -->
    <script src="script.js" defer></script> <!-- defer : define first load html all then load is script file -->
    <title>Document</title>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <h2>JavaScript Practice</h2>
   

    <!-- it is inline javascript -->
    <button onclick="alert(`Hello JavaScript`)">Click Me</button>

     <h1 id="hello"></h1>

    <!-- It is internal javascript -->
    <script>
      console.log("Hello, world!");

      document.getElementById("hello").innerHTML = "Hello JavaScript";
    </script>

    <!-- it is external javascript -->

    <!-- <script src="script.js"></script> -->
 
  </body>
</html>
